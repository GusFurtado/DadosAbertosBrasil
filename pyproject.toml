[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DadosAbertosBrasil"
version = "3.0.0"
description = "Pacote Python para acesso a dados abertos e APIs do governo brasileiro."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gustavo Furtado", email = "gustavofurtado2@gmail.com"},
]
keywords = [
    "brasil",
    "ibge",
    "ipea",
    "ipeadata",
    "camara",
    "deputados",
    "senado",
    "senadores",
    "bacen",
    "bcb",
    "bancocentral",
    "dadosabertos",
    "dadosgovbr",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.3.3",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
polars = ["polars>=1.0.0"]

[project.urls]
Homepage = "https://github.com/GusFurtado/DadosAbertosBrasil"
Documentation = "https://www.gustavofurtado.com/DadosAbertosBrasil/"
Download = "https://github.com/GusFurtado/DadosAbertosBrasil/archive/3.0.0.tar.gz"

[tool.setuptools.packages.find]
include = ["DadosAbertosBrasil*"]

[tool.setuptools.package-data]
DadosAbertosBrasil = ["py.typed"]
"*" = ["*.pyi"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "online: consulta APIs externas e depende de rede e da disponibilidade dos serviços",
]
# Testes marcados com `vcr` usam as respostas gravadas em tests/cassettes/.
addopts = "--record-mode=none"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13",
    "pytest-rerunfailures>=16",
    "ruff>=0.15.20",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
