name: Testes

on:
  pull_request:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: uv sync --locked --extra polars

      - name: Testes offline
        run: uv run pytest -m "not online"

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: uv sync --locked

      # Erros de sintaxe e nomes indefinidos: obrigatório.
      - name: ruff (erros graves)
        run: uv run ruff check --select E9,F63,F7,F82 DadosAbertosBrasil tests

      # O pacote ainda não segue todas as regras do pyproject: só informativo.
      - name: ruff (regras completas)
        continue-on-error: true
        run: uv run ruff check DadosAbertosBrasil tests --output-format github
